<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>URC — Remote Desktop</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar">
    <span class="brand">URC</span>
    <span id="status" class="status">connecting…</span>
    <span class="spacer"></span>
    <button id="paste-to-remote" type="button" title="Paste your local clipboard into the remote desktop">📋<span class="btn-label"> Paste</span></button>
    <button id="copy-from-remote" type="button" title="Copy the remote's last-sent clipboard into your local clipboard" hidden>📥<span class="btn-label"> Copy</span></button>
    <button id="toggle-files" type="button">📂<span class="btn-label"> Remote files</span></button>
    <button id="toggle-fullscreen" type="button">⛶</button>
    <button id="disconnect" type="button" title="Disconnect">✕<span class="btn-label"> Disconnect</span></button>
    <button id="hide-topbar" type="button" title="Hide this bar (click ▼ to bring it back)">▲</button>
  </header>

  <button id="show-topbar" type="button" class="show-topbar" hidden title="Show top bar">▼</button>

  <!-- backdrop closes the files drawer on mobile (tap outside) -->
  <div id="panel-backdrop" hidden></div>

  <!-- floating touch tools — visible only on coarse-pointer devices.
       A persistent FAB handle toggles the expandable tool tray. -->
  <div id="touch-tools" hidden>
    <div id="touch-bar" class="collapsed" role="toolbar" aria-label="Touch tools" aria-hidden="true">
      <button id="tb-right" type="button" title="Right-click">Right</button>
      <button id="tb-drag"  type="button" title="Toggle drag-lock" aria-pressed="false">Drag</button>
      <button id="tb-zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="tb-fit"   type="button" title="Reset zoom to fit" aria-label="Reset zoom to fit">Fit</button>
      <button id="tb-zoom-in"  type="button" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="tb-mic"   type="button" title="Voice dictation" aria-label="Voice dictation">🎤</button>
      <button id="tb-kbd"   type="button" title="Open keyboard" aria-label="Open keyboard">⌨</button>
    </div>
    <button id="tb-fab" type="button" class="tb-fab" aria-expanded="false"
            aria-controls="touch-bar" title="Show touch tools" aria-label="Show touch tools">⋯</button>
  </div>

  <!-- hidden textarea used solely to summon the Android soft keyboard -->
  <textarea id="keyboard-input" autocomplete="off" autocorrect="off"
            autocapitalize="off" spellcheck="false"
            aria-label="Keyboard input — type here to send keys to remote"
            ></textarea>

  <main id="layout">
    <section id="screen-wrap">
      <div id="screen"></div>
    </section>

    <aside id="files-panel" hidden>
      <div class="panel-header">
        <div class="panel-titlebar">
          <h2>Remote files</h2>
          <button id="close-files" type="button" class="close-btn" aria-label="Hide files panel" title="Hide (or press F)">×</button>
        </div>
        <div class="cwd-row">
          <span class="cwd-label">Uploads land in:</span>
          <code id="cwd" class="cwd">/</code>
        </div>
      </div>

      <div id="upload-zone" class="upload">
        <p>Drop files or folders here, or</p>
        <div class="upload-actions">
          <label class="btn" for="upload-input">📄 Upload files</label>
          <input type="file" id="upload-input" multiple class="visually-hidden">
          <label class="btn" for="upload-folder-input">📁 Upload folder</label>
          <input type="file" id="upload-folder-input" webkitdirectory directory multiple class="visually-hidden">
        </div>
        <div id="upload-progress" class="upload-progress" hidden></div>
      </div>

      <div id="files-list"></div>

      <div id="files-error" class="error" hidden></div>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
