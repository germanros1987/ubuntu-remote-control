name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-x86_64
            client_only: false
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
            client_only: false
          - runner: macos-14
            asset: darwin-aarch64
            client_only: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: |
          if [[ "${{ matrix.client_only }}" == "true" ]]; then
            cargo build --release -p urc-client
          else
            cargo build --release
          fi

      - name: Package tarball
        run: |
          mkdir -p dist
          if [[ "${{ matrix.client_only }}" == "true" ]]; then
            install -m755 target/release/urc-client dist/urc-client
            install -m755 packaging/scripts/urc dist/urc
            tar czf "${{ matrix.asset }}.tar.gz" -C dist urc-client urc
          else
            install -m755 target/release/urc-agent dist/urc-agent
            install -m755 target/release/urc-client dist/urc-client
            install -m755 target/release/urc-coordinator dist/urc-coordinator
            install -m755 packaging/scripts/urc dist/urc
            tar czf "${{ matrix.asset }}.tar.gz" -C dist \
              urc-agent urc-client urc-coordinator urc
          fi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}.tar.gz
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
