name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; do not cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-x86_64
            client_only: false
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
            client_only: false
          - runner: macos-14
            asset: darwin-aarch64
            client_only: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: |
          if [[ "${{ matrix.client_only }}" == "true" ]]; then
            cargo build --release -p urc-client
          else
            cargo build --release
          fi

      - name: Package tarball
        run: |
          mkdir -p dist
          if [[ "${{ matrix.client_only }}" == "true" ]]; then
            install -m755 target/release/urc-client dist/urc-client
            install -m755 packaging/scripts/urc dist/urc
            tar czf "${{ matrix.asset }}.tar.gz" -C dist urc-client urc
          else
            install -m755 target/release/urc-agent dist/urc-agent
            install -m755 target/release/urc-client dist/urc-client
            install -m755 target/release/urc-coordinator dist/urc-coordinator
            install -m755 packaging/scripts/urc dist/urc
            tar czf "${{ matrix.asset }}.tar.gz" -C dist \
              urc-agent urc-client urc-coordinator urc
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          retention-days: 5

  android:
    name: build android APK
    runs-on: ubuntu-24.04
    # Non-gating: a failed/flaky APK build must NOT block publishing the Rust +
    # mac binaries. continue-on-error makes this job count as "passed" for the
    # release job's `needs`, while still surfacing red in the UI. The APK is then
    # attached to the release only if it was actually produced (see Stage step).
    continue-on-error: true
    env:
      # Job-level so both the sign/stage steps' `if:` can read it. Empty when the
      # signing secret is absent (forks / unsigned builds).
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      # If a signing keystore is configured as repo secrets, sign the APK;
      # otherwise upload the unsigned APK (sideloaders can sign locally).
      - name: Sign APK
        id: sign
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/urc.keystore"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/urc.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out urc-android.apk "$UNSIGNED"

      - name: Stage unsigned APK
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk urc-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: urc-android.apk
          retention-days: 5

  release:
    name: publish GitHub Release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Stage release files
        run: |
          mkdir -p staged
          mv release-assets/*.tar.gz staged/
          # Android APK (merge-multiple flattened it into release-assets/).
          mv release-assets/urc-android.apk staged/ 2>/dev/null || true
          cp install staged/install
          cp packaging/install-mac-client.sh staged/install-mac-client.sh
          ls -la staged/

      - uses: softprops/action-gh-release@v2
        with:
          files: staged/*
          fail_on_unmatched_files: true
          generate_release_notes: true
