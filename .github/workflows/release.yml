name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; do not cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-x86_64
            client_only: false
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
            client_only: false
          - runner: macos-14
            asset: darwin-aarch64
            client_only: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: |
          if [[ "${{ matrix.client_only }}" == "true" ]]; then
            cargo build --release -p urc-client
          else
            cargo build --release
          fi

      - name: Package tarball
        run: |
          mkdir -p dist
          if [[ "${{ matrix.client_only }}" == "true" ]]; then
            install -m755 target/release/urc-client dist/urc-client
            install -m755 packaging/scripts/urc dist/urc
            tar czf "${{ matrix.asset }}.tar.gz" -C dist urc-client urc
          else
            install -m755 target/release/urc-agent dist/urc-agent
            install -m755 target/release/urc-client dist/urc-client
            install -m755 target/release/urc-coordinator dist/urc-coordinator
            install -m755 packaging/scripts/urc dist/urc
            tar czf "${{ matrix.asset }}.tar.gz" -C dist \
              urc-agent urc-client urc-coordinator urc
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          retention-days: 5

  release:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Stage release files
        run: |
          mkdir -p staged
          mv release-assets/*.tar.gz staged/
          cp install staged/install
          cp packaging/install-mac-client.sh staged/install-mac-client.sh
          ls -la staged/

      - uses: softprops/action-gh-release@v2
        with:
          files: staged/*
          fail_on_unmatched_files: true
          generate_release_notes: true
