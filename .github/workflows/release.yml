name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-x86_64
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Package tarball
        run: |
          mkdir -p dist
          install -Dm755 target/release/urc-agent dist/urc-agent
          install -Dm755 target/release/urc-client dist/urc-client
          install -Dm755 target/release/urc-coordinator dist/urc-coordinator
          install -Dm755 packaging/scripts/urc dist/urc
          tar czf "${{ matrix.asset }}.tar.gz" -C dist \
            urc-agent urc-client urc-coordinator urc

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}.tar.gz
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
